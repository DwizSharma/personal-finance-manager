# ===== Server =====
server.port=8081

# ===== MySQL Datasource =====
# Create the database first:  CREATE DATABASE finance_manager;
spring.datasource.url=jdbc:mysql://localhost:3306/finance_manager?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# ===== Thymeleaf =====
spring.thymeleaf.cache=false

# ===== App info =====
spring.application.name=personal-finance-manager
