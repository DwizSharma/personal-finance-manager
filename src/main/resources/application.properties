# ===== Server =====
server.port=8081

# ===== MySQL Datasource =====
# Create the database first:  CREATE DATABASE finance_manager;   (see /database/*.sql)
spring.datasource.url=jdbc:mysql://localhost:3306/finance_manager?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
# Set DB_PASSWORD in your environment / IntelliJ run config, or replace the text after the colon.
spring.datasource.password=OKmlg@298
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Categories are seeded from Java (CategorySeeder), so SQL script init is switched off.
spring.sql.init.mode=never

# HTML <input type="date"> sends yyyy-MM-dd; make Spring parse LocalDate params that way.
spring.mvc.format.date=iso

# ===== Thymeleaf =====
spring.thymeleaf.cache=false

# ===== App info =====
spring.application.name=personal-finance-manager
