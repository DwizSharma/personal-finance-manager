<div xmlns:th="http://www.thymeleaf.org" th:fragment="sidebar(active)" class="sidebar">
    <div class="brand">
        <span class="brand-mark">₹</span>
        <span class="brand-name">FinanceManager</span>
    </div>
    <nav class="side-nav">
        <a th:href="@{/dashboard}" th:classappend="${active == 'dashboard'} ? 'active'">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
            Dashboard
        </a>
        <a th:href="@{/addIncome}" th:classappend="${active == 'income'} ? 'active'">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
            Add Income
        </a>
        <a th:href="@{/addExpense}" th:classappend="${active == 'expense'} ? 'active'">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/></svg>
            Add Expense
        </a>
        <a th:href="@{/transactions}" th:classappend="${active == 'transactions'} ? 'active'">Transactions</a>
        <a th:href="@{/budgets}" th:classappend="${active == 'budgets'} ? 'active'">Budgets & alerts</a>
        <a th:href="@{/integrations/upi}" th:classappend="${active == 'upi'} ? 'active'">Payment apps</a>
        <a th:href="@{/settings/theme}" th:classappend="${active == 'settings'} ? 'active'">Appearance</a>
    </nav>
    <form th:action="@{/logout}" method="post" class="logout-form"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button type="submit" class="logout-link">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Logout
    </button></form>
    <a th:href="@{/reports/download(format='pdf')}" class="logout-link">Download monthly report</a>
    <button class="quick-add-fab" type="button" onclick="document.getElementById('quick-add-dialog').showModal()" aria-label="Quick add transaction">+</button>
    <dialog id="quick-add-dialog" class="quick-add-dialog"><button type="button" class="dialog-close" onclick="this.closest('dialog').close()" aria-label="Close">×</button><h2>Quick add</h2><p>Choose the type of transaction to record.</p><a class="button" th:href="@{/addExpense}">Add expense</a><a class="button secondary" th:href="@{/addIncome}">Add income</a></dialog>
</div>
