<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - Personal Finance Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="auth-page">
    <div class="auth-card">
        <div class="auth-brand">
            <span class="brand-mark">₹</span>
            <span class="brand-name">FinanceManager</span>
        </div>
        <h2>Welcome back</h2>
        <p class="subtitle">Log in to see your dashboard.</p>

        <p class="error" th:if="${param.error}">Invalid username or password.</p>
        <p class="success" th:if="${param.logout}">You have been logged out.</p>
        <p class="success" th:if="${param.registered}">Registration successful, please log in.</p>

        <form th:action="@{/login}" method="post">
            <label>Username</label>
            <input type="text" name="username" required autofocus>

            <label>Password</label>
            <input type="password" name="password" required>

            <button class="btn btn-block" type="submit">Login</button>
        </form>

        <p class="auth-footer">No account? <a th:href="@{/register}">Register here</a></p>
    </div>
</div>
</body>
</html>
