<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Transactions | Finance Manager</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><div class="app-shell"><div th:replace="~{fragments/nav :: sidebar(active='transactions')}"></div><main class="main"><header class="page-header"><h1>Transactions</h1><p class="subtitle">Add and review your income and expenses.</p></header><section class="card"><h2>Quick entry</h2><p>Choose an entry type to open the secure transaction form.</p><a class="button" th:href="@{/addExpense}">Add expense</a> <a class="button secondary" th:href="@{/addIncome}">Add income</a></section><section class="card"><h2>Accounts</h2><form method="post" th:action="@{/accounts}" class="goal-form"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label>Account name<input name="accountName" required></label><label>Type<select name="accountType"><option th:each="type:${T(com.financemanager.entity.Account.Type).values()}" th:value="${type}" th:text="${type}"></option></select></label><label>Starting balance<input name="balance" type="number" step="0.01" value="0"></label><label>Currency<input name="currency" value="INR" maxlength="3" required></label><button class="button" type="submit">Add account</button></form><p th:each="a:${accounts}" th:text="${a.accountName} + ' · ' + ${a.accountType} + ' · ' + ${a.currency} + ' ' + ${a.balance}"></p><p th:if="${#lists.isEmpty(accounts)}" class="empty-state">No accounts yet. Add one to associate entries.</p></section><section class="card"><h2>Recent activity</h2><label>Search transactions <input id="transactionSearch" type="search" placeholder="Search merchant or category"></label><div class="table-wrap"><table id="transactionsTable"><thead><tr><th>Date</th><th>Type</th><th>Category</th><th>Description</th><th>Amount</th></tr></thead><tbody><tr th:each="e:${expenses}" class="transaction-row"><td th:text="${e.date}"></td><td>Expense</td><td th:text="${e.category.name}"></td><td th:text="${e.description}"></td><td th:text="${e.amount}"></td></tr><tr th:each="i:${incomes}" class="transaction-row"><td th:text="${i.date}"></td><td>Income</td><td th:text="${i.category.name}"></td><td th:text="${i.description}"></td><td th:text="${i.amount}"></td></tr></tbody></table></div></section></main></div><script>document.getElementById('transactionSearch').addEventListener('input',e=>{const q=e.target.value.toLowerCase();document.querySelectorAll('.transaction-row').forEach(r=>r.hidden=!r.innerText.toLowerCase().includes(q));});</script></body></html>
