<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Budgets | Finance Manager</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><div class="app-shell"><div th:replace="~{fragments/nav :: sidebar(active='budgets')}"></div><main class="main"><header class="page-header"><h1>Budgets & alerts</h1><p class="subtitle">Set monthly limits and review budget notifications.</p></header><section class="card"><h2>Create or update a category budget</h2><form method="post" th:action="@{/budgets}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label>Category<select name="categoryId" required><option th:each="c:${categories}" th:value="${c.id}" th:text="${c.name}"></option></select></label><label>Monthly limit<input name="monthlyLimit" type="number" min="0.01" step="0.01" required></label><button class="button" type="submit">Save budget</button></form></section><section class="card"><h2>This month's budgets</h2><div class="budget-item" th:each="b:${budgetStats}"><div class="budget-heading"><strong th:text="${b.name}"></strong><span th:text="${b.spent} + ' / ' + ${b.limit}"></span></div><progress max="100" th:value="${b.percent}" th:classappend="${b.tone}"></progress><small th:text="${b.percent} + '% used'"></small></div><p th:if="${#lists.isEmpty(budgets)}" class="empty-state">No budgets set yet.</p></section><section class="card"><h2>Notifications</h2><p th:each="a:${alerts}" th:text="${a.message} + ' · ' + ${a.createdAt}"></p><p th:if="${#lists.isEmpty(alerts)}" class="empty-state">No alerts yet.</p></section></main></div></body></html>
