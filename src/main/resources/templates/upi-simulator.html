<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="csrf-token" th:content="${_csrf.token}"><meta name="csrf-header" th:content="${_csrf.headerName}"><title>UPI sync</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><div class="app-shell"><div th:replace="~{fragments/nav :: sidebar(active='upi')}"></div><main class="main"><header class="page-header"><h1>Payment app sync</h1><p class="subtitle">Import a payment notification as a transaction.</p></header><section class="card"><div class="provider-badges"><span>PhonePe · Ready</span><span>Paytm · Ready</span><span>Google Pay · Ready</span></div><label for="message">Payment notification</label><textarea id="message" rows="4">Paid Rs. 450 to Starbucks via PhonePe TxnID 987654</textarea><button class="button" id="sync">Sync transaction</button><p id="result" role="status"></p></section></main></div><script>document.querySelector('#sync').addEventListener('click',async()=>{const out=document.querySelector('#result');out.textContent='Syncing…';try{const res=await fetch('/api/v1/upi/webhook',{method:'POST',headers:{'Content-Type':'application/json',[document.querySelector('meta[name=csrf-header]').content]:document.querySelector('meta[name=csrf-token]').content},body:JSON.stringify({message:document.querySelector('#message').value})});const data=await res.json();if(!res.ok)throw new Error(data.message||'Unable to sync transaction');out.textContent=`Saved ${data.amount} for ${data.merchant}. ${data.budgetAlert}`;}catch(e){out.textContent=e.message;}});</script></body></html>
