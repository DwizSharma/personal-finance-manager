<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Appearance settings</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><div class="app-shell"><div th:replace="~{fragments/nav :: sidebar(active='settings')}"></div><main class="main"><header class="page-header"><h1>Appearance</h1><p class="subtitle">Choose your preferred display settings.</p></header><section class="card settings-form"><label>Color accent<select id="accent"><option value="#6558d3">Indigo</option><option value="#147d64">Forest</option><option value="#c15b36">Terracotta</option><option value="#2473a6">Ocean</option></select></label><label>Currency symbol<select id="currency"><option>₹</option><option>$</option><option>€</option><option>£</option></select></label><label class="inline-label"><input id="darkMode" type="checkbox"> Dark mode</label><button id="saveTheme" class="button">Save preferences</button><p id="saved" role="status"></p></section></main></div><script>(()=>{let s=JSON.parse(localStorage.getItem('finance-theme')||'{}');const accent=document.querySelector('#accent'),currency=document.querySelector('#currency'),dark=document.querySelector('#darkMode');accent.value=s.accent||accent.value;currency.value=s.currency||'₹';dark.checked=!!s.dark;document.documentElement.style.setProperty('--accent',accent.value);document.body.classList.toggle('dark-mode',dark.checked);document.querySelector('#saveTheme').onclick=()=>{s={accent:accent.value,currency:currency.value,dark:dark.checked};localStorage.setItem('finance-theme',JSON.stringify(s));document.documentElement.style.setProperty('--accent',s.accent);document.body.classList.toggle('dark-mode',s.dark);document.querySelector('#saved').textContent='Preferences saved on this device.';};})();</script></body></html>
