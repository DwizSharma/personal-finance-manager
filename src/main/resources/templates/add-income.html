<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add Income - Personal Finance Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments/nav :: sidebar(active='income')}"></div>

    <main class="main">
        <div class="page-header">
            <h1>Log a new income entry</h1>
            <p class="subtitle">Keep your net balance and savings rate accurate.</p>
        </div>

        <div class="card form-card">
            <form th:action="@{/addIncome}" method="post">
                <label>Amount</label>
                <input type="number" step="0.01" name="amount" required>

                <label>Description</label>
                <input type="text" name="description" placeholder="e.g. Monthly salary">

                <label>Date</label>
                <input type="date" name="date" required>

                <label>Category</label>
                <select name="categoryId" required>
                    <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"></option>
                </select>
                <label>Deposit account</label><select name="accountId"><option value="">No account selected</option><option th:each="a:${accounts}" th:value="${a.id}" th:text="${a.accountName} + ' (' + ${a.currency} + ')' "></option></select>

                <button class="btn" type="submit">Save Income</button>
            </form>
        </div>
    </main>
</div>
</body>
</html>
