<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add Expense - Personal Finance Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments/nav :: sidebar(active='expense')}"></div>

    <main class="main">
        <div class="page-header">
            <h1>Log a new expense</h1>
            <p class="subtitle">We'll automatically check it against your monthly budget cap.</p>
        </div>

        <div class="card form-card">
            <p class="error" th:if="${error}" th:text="${error}"></p>

            <form th:action="@{/addExpense}" method="post" id="expense-form">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <label>Amount</label>
                <input type="number" step="0.01" min="0.01" name="amount" id="total-amount" required>

                <label>Description</label>
                <input type="text" name="description" placeholder="e.g. Weekly groceries">

                <label>Date</label>
                <input type="date" name="date" required>

                <label>Category</label>
                <select name="categoryId" id="primary-category" required>
                    <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"></option>
                </select>
                <label>Account</label><select name="accountId"><option value="">No account selected</option><option th:each="a:${accounts}" th:value="${a.id}" th:text="${a.accountName} + ' (' + ${a.currency} + ')' "></option></select>
                <label>Payment method</label><select name="paymentMethod"><option th:each="method:${T(com.financemanager.entity.PaymentMethod).values()}" th:value="${method}" th:text="${method}"></option></select>

                <div class="split-section">
                    <label class="split-toggle-row">
                        <input type="checkbox" id="split-toggle">
                        Split this expense across more than one category
                    </label>

                    <div id="split-rows" class="split-rows" style="display:none;">
                        <div id="split-row-template" class="split-row" style="display:none;">
                            <select class="split-category">
                                <option value="">Category</option>
                                <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"></option>
                            </select>
                            <input type="number" step="0.01" min="0.01" class="split-amount" placeholder="Amount">
                            <input type="text" class="split-note" placeholder="Note (optional)">
                            <button type="button" class="split-remove">Remove</button>
                        </div>

                        <div class="split-summary">
                            Allocated: <strong id="split-allocated">0.00</strong> of <strong id="split-target">0.00</strong>
                            <span id="split-remaining-note"></span>
                        </div>
                        <button type="button" class="btn btn-secondary btn-sm" id="add-split-row">+ Add category</button>
                    </div>
                </div>

                <button class="btn" type="submit">Save Expense</button>
            </form>
        </div>
    </main>
</div>
<dialog id="budget-warning" class="quick-add-dialog"><h2>Budget limit exceeded</h2><p id="budget-warning-text">This expense will exceed your monthly category budget.</p><button type="button" class="button secondary" id="cancel-expense">Cancel expense</button><button type="button" class="button" id="proceed-expense">Proceed anyway & log alert</button></dialog>

<script th:inline="javascript">
(function () {
    var toggle = document.getElementById('split-toggle');
    var rowsContainer = document.getElementById('split-rows');
    var rowTemplate = document.getElementById('split-row-template');
    var addBtn = document.getElementById('add-split-row');
    var totalAmountInput = document.getElementById('total-amount');
    var allocatedEl = document.getElementById('split-allocated');
    var targetEl = document.getElementById('split-target');
    var remainingNoteEl = document.getElementById('split-remaining-note');
    var form = document.getElementById('expense-form');
    var allowSubmit = false;

    function fmt(n) { return isNaN(n) ? '0.00' : n.toFixed(2); }

    function addRow(categoryId, amount, note) {
        var row = rowTemplate.cloneNode(true);
        row.style.display = '';
        row.removeAttribute('id');
        if (categoryId) row.querySelector('.split-category').value = categoryId;
        if (amount != null) row.querySelector('.split-amount').value = amount;
        if (note) row.querySelector('.split-note').value = note;
        row.querySelector('.split-amount').addEventListener('input', recalc);
        row.querySelector('.split-remove').addEventListener('click', function () {
            row.remove();
            recalc();
        });
        rowsContainer.insertBefore(row, rowsContainer.querySelector('.split-summary'));
        return row;
    }

    function recalc() {
        var total = parseFloat(totalAmountInput.value) || 0;
        targetEl.textContent = fmt(total);
        var rows = rowsContainer.querySelectorAll('.split-row');
        var allocated = 0;
        rows.forEach(function (r) {
            allocated += parseFloat(r.querySelector('.split-amount').value) || 0;
        });
        allocatedEl.textContent = fmt(allocated);
        var diff = total - allocated;
        if (Math.abs(diff) < 0.01) {
            remainingNoteEl.textContent = '(fully allocated)';
            remainingNoteEl.style.color = 'var(--color-success)';
        } else if (diff > 0) {
            remainingNoteEl.textContent = '(' + fmt(diff) + ' left to allocate)';
            remainingNoteEl.style.color = '';
        } else {
            remainingNoteEl.textContent = '(over by ' + fmt(-diff) + ')';
            remainingNoteEl.style.color = 'var(--color-danger)';
        }
    }

    function setSplitEnabled(enabled) {
        rowsContainer.style.display = enabled ? '' : 'none';
        if (enabled && rowsContainer.querySelectorAll('.split-row').length === 0) {
            addRow(document.getElementById('primary-category').value, totalAmountInput.value, '');
            addRow(null, null, '');
            recalc();
        }
    }

    toggle.addEventListener('change', function () { setSplitEnabled(toggle.checked); });
    addBtn.addEventListener('click', function () { addRow(null, null, ''); recalc(); });
    totalAmountInput.addEventListener('input', recalc);

    form.addEventListener('submit', function (e) {
        if (!allowSubmit) {
            e.preventDefault();
            var date = form.querySelector('[name=date]').value;
            var categoryId = document.getElementById('primary-category').value;
            var amount = totalAmountInput.value;
            fetch('/api/v1/budgets/check?categoryId=' + encodeURIComponent(categoryId) + '&amount=' + encodeURIComponent(amount) + '&date=' + encodeURIComponent(date))
                .then(function (r) { if (!r.ok) throw new Error('Budget check failed'); return r.json(); })
                .then(function (data) {
                    if (data.breached) { document.getElementById('budget-warning-text').textContent = data.message; document.getElementById('budget-warning').showModal(); }
                    else { allowSubmit = true; form.requestSubmit(); }
                }).catch(function () { window.alert('Could not check the budget. Please try again.'); });
            return;
        }
        if (!toggle.checked) return;
        var rows = rowsContainer.querySelectorAll('.split-row');
        rows.forEach(function (r) {
            var catVal = r.querySelector('.split-category').value;
            var amtVal = r.querySelector('.split-amount').value;
            if (!catVal || !amtVal) return;
            ['splitCategoryId', 'splitAmount', 'splitNote'].forEach(function (name, i) {
                var input = document.createElement('input');
                input.type = 'hidden';
                input.name = name;
                input.value = i === 0 ? catVal : (i === 1 ? amtVal : r.querySelector('.split-note').value);
                form.appendChild(input);
            });
        });
        var total = parseFloat(totalAmountInput.value) || 0;
        var allocated = 0;
        rows.forEach(function (r) { allocated += parseFloat(r.querySelector('.split-amount').value) || 0; });
        if (Math.abs(total - allocated) > 0.01) {
            e.preventDefault();
            alert('Split amounts must add up to the total (' + fmt(total) + '). Currently allocated: ' + fmt(allocated) + '.');
        }
    });
    document.getElementById('cancel-expense').addEventListener('click', function () { document.getElementById('budget-warning').close(); });
    document.getElementById('proceed-expense').addEventListener('click', function () { document.getElementById('budget-warning').close(); allowSubmit = true; form.requestSubmit(); });
})();
</script>
</body>
</html>
